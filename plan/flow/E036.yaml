urn: acc:flow:E036-UNIT-001
phase: UNIT
description: >-
  The lifecycle convention and README state the owner-directed context transition: at ~80% context the
  source reaches a quiescent point (no in-flight push, rebase, review submission or test run), authors the
  canonical handover listing unexecuted message IDs, exact branch head, remote push state and pending
  writes, and runs /new in the same bound pane and Pi process; the fresh context runs handover show,
  re-verifies remote state before any push, and reconciles its inbox. A coordinator-authored handover is
  only for a source past its window and is unverified. Compaction is not the transition mechanism and /new
  is not claimed verified until its verifier releases. Text only; no runtime behavior change.
