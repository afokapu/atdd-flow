urn: acc:flow:E014-UNIT-001
phase: UNIT
description: >-
  A driver or coordinator at the context threshold records a validated
  source-session handover and may rotate through the existing guarded launcher.
  After a final provider quota error, Pi switches to a separately configured
  authenticated handoff-only rescue model, records a validated handover, and
  then selects a distinct eligible execution candidate from models.yaml.
  No Jev decision, premature writer replacement, or change to task/Desk
  authority is allowed. Main retains its separately authorized Path-A.
