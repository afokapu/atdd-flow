name: ATD-42 diagnostic (temporary)
on:
  pull_request:
permissions:
  contents: read
  packages: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
      - name: Print changed-file conventions diagnostics
        shell: bash
        run: |
          set +e
          bun run atdd-bun all > /tmp/atd-42-check.txt 2>&1
          code=$?
          echo "Direct check returned $code"
          echo "=== CHANGED FILE FINDINGS ==="
          grep -n -B 3 -A 5 -E 'src/tasks\.ts|src/threads\.ts|task-phase-handoff\.red\.test\.ts|plan/flow/E043\.yaml' /tmp/atd-42-check.txt | tail -n 240 || true
          echo "=== FIRST AND LAST ERRORS ==="
          grep -n -i -E 'error|finding|violation|complexity|test.*phase' /tmp/atd-42-check.txt | head -n 50 || true
          tail -n 35 /tmp/atd-42-check.txt
          exit 0
