# Publishes @afokapu/atdd-flow from main with npm trusted publishing.
# The package is public so any coordinator or driver can install the same CLI.
name: Publish

on:
  push:
    branches: [main]
    paths:
      - bin/**
      - conventions/**
      - extensions/**
      - multiplexer/**
      - src/**
      - examples/**
      - .github/workflows/publish.yml
      - bun.lock
      - package.json
      - README.md
      - LICENSE
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - run: bun test --max-concurrency=1 --timeout 20000
      - name: Verify package provenance and version uniqueness
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          test "$name" = "@afokapu/atdd-flow"
          test -n "$version"
          git diff --exit-code
          if git rev-parse --verify --quiet "refs/tags/v$version"; then
            echo "Refusing to publish tagged version $version" >&2
            exit 1
          fi
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "Refusing to publish existing registry version $name@$version" >&2
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_ENV"
      - run: npm pack --dry-run
      - run: npm publish --provenance --access public
      - name: Tag published source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag "v${{ env.version }}"
          git push origin "v${{ env.version }}"
