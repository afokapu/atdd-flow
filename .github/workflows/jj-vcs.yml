name: JJ VCS Proof

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jj-vcs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Jujutsu 0.46.0
        run: |
          curl -fsSL -o /tmp/jj.tar.gz https://github.com/jj-vcs/jj/releases/download/v0.46.0/jj-v0.46.0-x86_64-unknown-linux-musl.tar.gz
          echo "fce0271158e665ceb82dc66c5eb95b1728649094e9133074f3b5baece345fc08  /tmp/jj.tar.gz" | sha256sum -c -
          mkdir /tmp/jj-bin
          tar -xzf /tmp/jj.tar.gz -C /tmp/jj-bin
          sudo install /tmp/jj-bin/jj /usr/local/bin/jj
          jj version
      - name: Real colocated Jujutsu integration
        run: bun test tests/jj-vcs.integration.test.ts
      - name: Temporary focused continuation proof
        run: bun test tests/obligation-continuation.test.ts
      - name: Temporary ATDD diagnostic
        if: always()
        continue-on-error: true
        run: bun run atdd-bun all
