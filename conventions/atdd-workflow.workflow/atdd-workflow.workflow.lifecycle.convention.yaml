schema_version: 1.1.0
rule_id: atdd-workflow.workflow.lifecycle
kind: policy
status: active
name: Coordinate durable agent work through seats, tasks, and threads
statement: >-
  When the workflow profile is active, agents coordinate durable work through the locally installed
  atdd-flow CLI and its YAML coordination root. A seat owns its runtime binding, branch and
  worktree; a task owns its delivery state and proof; a thread owns its conversation. Drivers favor
  the smallest effective implementation, coordinate shared-boundary decisions through their
  coordinators, and continue assigned work until it is review-ready or explicitly blocked.
terms:
- term_id: workflow_root
  text: >-
    The separate coordination repository holding work/, threads/, and the durable YAML records.
- term_id: seat
  text: >-
    A replaceable agent responsibility with a purpose, worktree/branch binding, checkpoint, and
    optional native application addresses.
- term_id: retirement
  text: >-
    The final housekeeping step for an idle driver seat. It is delegated to ATDD Bun rather than
    performed with raw Git commands.
- term_id: smallest_sufficient_change
  text: >-
    The least broad implementation that correctly satisfies the current task's done_when criteria
    and the repository's existing conventions.
- term_id: responsibility_boundary
  text: >-
    A point where implementation requires agreement about vocabulary, interfaces, contracts,
    ownership, or responsibility shared with another seat or project.
- term_id: boundary_handshake
  text: >-
    The coordinator-mediated agreement used when a driver reaches a shared responsibility boundary.
    Coordinators resolve only the minimum shared contract necessary to continue implementation and
    record that agreement durably in a Workflow thread.
- term_id: review_ready
  text: >-
    A task state reached only after required implementation and verification are complete, every
    done_when criterion carries proof, the task has been moved to review, and the coordinator has
    received the result.
- term_id: model_portfolio
  text: >-
    The models.yaml list of launchable model candidates, ordered strongest to weakest. Seats do not
    normally own a model; Jev selects the weakest available candidate sufficient for the current work.
- term_id: behavioral_review
  text: >-
    The independent final semantic reconciliation performed after deterministic gates and before a
    Workflow-governed task may move from review to done. ATDD Bun owns the substantive review method;
    Workflow owns routing, reviewer allocation, durable evidence, and lifecycle enforcement.
content:
  summary: >-
    Use coordination records as the durable source of truth. Drivers implement the smallest effective
    solution, coordinators resolve shared-boundary ambiguity, and an assigned task continues until
    review-ready or explicitly blocked.
  normative_text: |
    Before taking workflow action in a repository, run `atdd-flow --help` to discover the
    commands and current syntax available in the installed CLI. If the executable is project-local
    and not on PATH, run `bunx atdd-flow --help`. Treat that help output as the command authority:
    do not invent flags, infer command forms from memory, or rely on an older agent's instructions.

    Start from the current seat, checkpoint, assigned tasks, and relevant thread records. A replacement
    agent resumes from those records; it does not depend on a conversation with its predecessor.

    `operator@desk` is the human authority, not an autonomous agent identity. Never post, approve,
    or make a decision while claiming that address unless the human operator actually supplied it.
    Main seats are the normal repository-main integration gateway to the operator. Coordinators may
    escalate a concrete decision or incident directly to the operator. Drivers send normal work
    messages to their coordinator; they do not directly message the operator or main seat. A receipt
    or result addresses the seat that made the request, not every historical participant in the thread.

    A driver starts only its assigned ready task. Treat the task's done_when criteria as the required
    delivery scope. Prefer existing repository patterns, components, dependencies, contracts, and
    abstractions. When multiple implementations are correct, choose the smallest effective change that
    agrees with the existing system.

    Do not redesign adjacent systems, introduce generalized infrastructure, add dependencies, create
    abstractions for hypothetical future requirements, or perform unrelated cleanup merely because the
    opportunity was discovered. Broaden the implementation only when a done_when criterion requires it,
    the current design cannot correctly satisfy the task without it, or the broader change is necessary
    to resolve a verified blocker.

    Work criterion by criterion. Continue from the next unmet done_when criterion through
    implementation, verification, and proof rather than treating successful code generation as task
    completion.

    An autonomous work turn on an assigned in_progress task must not intentionally end while required
    work remains actionable. Complete the required implementation, run the relevant tests and ATDD Bun
    checks, correct failures caused by the work, record proof for every done_when criterion, move the
    task to review, and send the coordinator a result. Continue until the task is review-ready or
    explicitly blocked.

    If completion is impossible, record the blocker, checkpoint the exact current state and next action,
    and notify the coordinator. Do not silently leave actionable required work unfinished.

    When a driver reaches a responsibility boundary involving shared vocabulary, endpoint shape,
    contracts, artifact ownership, or another participant's responsibility, do not independently
    redefine the shared contract. Send the concrete boundary question to the driver's coordinator.

    The coordinator aligns directly with affected coordinators through the existing durable thread
    mechanism. Resolve only the minimum shared vocabulary, interface, ownership, or responsibility split
    needed for the current work. Prefer an existing convention or contract over inventing a new one.
    Record the agreement in the relevant thread and communicate the result back to affected drivers.

    Boundary coordination is not an invitation to redesign adjacent systems or solve hypothetical future
    needs. A settled boundary decision remains in force unless implementation produces concrete evidence
    that it cannot satisfy the task.

    A driver waiting on a boundary decision continues any independent required work that remains
    actionable. Mark the task blocked only when the unresolved decision prevents further meaningful
    progress.

    Use `atdd-flow scout` only when repository scope is genuinely unclear or candidate files are
    numerous. Use `atdd-flow focus-check` only before a likely scope expansion such as a new
    dependency, generalized abstraction, persistent schema, architecture change, adjacent refactor, or
    unrelated defect. These read-only Jev judgments advise scope; they do not own correctness or completion.

    New seats do not pin a model. The Desk's models.yaml is ordered strongest to weakest, and ordinary
    launches ask Jev for the weakest available model sufficient for the seat's current active work. If
    Jev model selection is unavailable or low-confidence, use the strongest available configured model.
    A legacy Desk without models.yaml may continue to use its pinned seat agent.

    Do not add a writer/reviewer pair after every development phase. The next phase consumes and
    semantically challenges the prior phase while active ATDD Bun conventions provide deterministic
    enforcement. Reserve the explicit independent semantic reviewer for the final integration boundary.

    A driver records proof for every done_when criterion, moves the completed task to review, and sends
    its coordinator a result. Before a final behavioral reviewer is launched, Workflow runs the
    deterministic ATDD Bun gates in the delivery worktree. If a strict gate is red, do not invoke the
    semantic reviewer; return the discrepancy to the appropriate implementation phase.

    After deterministic gates pass, Jev may answer only bounded routing questions for final review. It
    classifies the required review surface as LOCAL, ASSEMBLED, JOURNEY, or SYSTEM and supplies routing
    signals such as behavior-affecting versus behavior-preserving intent, highest relevant proof
    boundary, cross-path scope, consequence, reconciliation shape, runtime observability, and confidence.
    Jev must not approve a delivery, decide semantic correctness, mutate task state, or redefine intent.
    Low-confidence routing is treated conservatively as SYSTEM.

    Workflow maps the bounded routing result through models.yaml to select a reviewer model, creates a
    task-scoped reviewer responsibility in the delivery worktree, and provides the reviewer inputs in
    this order: task criteria/source; relevant plan artifacts; deterministic gate evidence; executable
    proof; runtime/worktree; then implementation/diff context. The complete installed
    atdd-bun.review.behavioral-reconciliation convention is the authoritative review method and must be
    included in the reviewer prompt. Workflow must not duplicate that methodology in its own convention.

    The reviewer records durable structured evidence containing intent sources, expected behavior,
    exercised boundary and evidence, observed behavior, reconciliation findings, a decision of APPROVE,
    RETURN, or ESCALATE, rationale, and confidence. The reviewer does not mutate task state. APPROVE
    makes the current clean delivery commit eligible for coordinator completion. RETURN is evidence for
    the coordinator to move review back to in_progress. ESCALATE leaves the task in review, or the
    coordinator may explicitly block it, until authoritative intent is resolved. Only the coordinator
    may move review to done.

    For repositories explicitly governed by the workflow profile, Workflow deterministically prevents
    review -> done unless the latest behavioral-review attempt is complete, records APPROVE, and matches
    the current clean delivery commit. These checks prove that the required review occurred and applies
    to the delivery being completed; they do not prove the reviewer's semantic judgment is correct.

    A driver seat may own more than one task. A coordinator uses
    `atdd-flow task done <project> <task> --by <coordinator> --retire-assignee` only when every
    task assigned to that driver in the project is done and the seat is intentionally being retired.
    That operation delegates to `atdd-bun worktree finish --delete-branch`; do not remove a worktree,
    delete a delivery branch, or force cleanup through raw Git. A failed retirement leaves the task in
    review and writes a blocked checkpoint for investigation.

    Before working in or retiring a driver worktree, install that repository's local dependencies there.
    Retirement resolves ATDD Bun from the worktree's local node_modules/.bin so it does not depend on a
    developer's global executable installation.

    Use the atdd-flow CLI to mutate workflow records. Read task, seat, checkpoint, and thread YAML
    before acting; do not treat terminal pane history, a multiplexer, an optional judgment helper, or an
    agent's private memory as durable coordination state.
  fix_hint: >-
    Return to the assigned task and its unmet done_when criteria. Remove speculative scope that is not
    required for correctness. Resolve shared boundary ambiguity through the relevant coordinators.
    Complete remaining verification and proof, or explicitly record the blocker and next action.
  exceptions:
  - A broader change is permitted when it is necessary to satisfy the current task correctly or resolve
    a verified blocker.
  - A driver may continue independent work while waiting for a boundary decision.
  - A task may be completed normally without retiring its assignee when that driver still has work.
  - A live host may notify an agent to inspect its seat, but it never owns the durable state.
  - An optional Jev scouting, focus, final-review-routing, or model-selection judgment may advise
    execution, but it never owns task state, proof, correctness, or completion authority.
metadata:
  aliases:
  - ATDD-WORKFLOW-LIFECYCLE
  introduced_in: 0.1.3
implementation:
  type: none
